version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      composer-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      # A vite-plus bump fails CI until the `vite` alias in package.json devDependencies is moved to the
      # same vite-plus-core version, because Dependabot can't update npm aliases. On its PR: bump the alias,
      # run `npm install`, and commit package.json and package-lock.json. Its own group keeps that red PR
      # from holding back the other npm updates.
      vite-plus:
        patterns:
          - "vite-plus"
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 (the native compiler) breaks Vue's SFC compiler and vue-tsc; revisit once Vue supports it.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Keep the Node types on the major in .nvmrc; bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
